name: Build and Release
on: push

jobs:
  build:
    name: Build ${{matrix.os-name}}
    permissions:
      contents: read
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os-name: linux-x64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - os-name: linux-arm64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

          - os-name: osx-x64
            runs-on: macOS-latest
            target: x86_64-apple-darwin

          - os-name: osx-arm64
            runs-on: macOS-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install macFUSE
        if: runner.os == 'macOS'
        run: |
          brew install --cask macfuse
          {
            echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
          } >> "$GITHUB_ENV"

      - name: Build
        uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.target }}
          args: "--locked --release --bin xiv-fuse"
          strip: true

      - name: Rename Binary
        shell: bash
        run: |
          mv -f target/${{ matrix.target }}/release/xiv-fuse xiv-fuse-${{ matrix.os-name }}

      - name: Attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            xiv-fuse-${{ matrix.os-name }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xiv-fuse-${{ matrix.os-name }}
          path: |
            xiv-fuse-${{ matrix.os-name }}
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download All Builds
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          draft: false
          make_latest: true
          files: |
            artifacts/*/*
